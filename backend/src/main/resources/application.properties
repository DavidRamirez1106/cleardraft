# ============================================================================
# Configuracion de la aplicacion. Los valores ${VARIABLE:default} leen una
# variable de entorno del sistema operativo; si no existe, usan el default
# despues de los dos puntos. ASI es como mantenemos secretos (la API key) fuera
# del codigo fuente: nunca se escribe la clave real aqui, solo el NOMBRE de la
# variable de entorno que la contiene.
# ============================================================================

spring.application.name=cleardraft-backend
server.port=8080

# --- Proveedor de IA ---
# OPENAI_API_KEY no tiene default: si no la defines, la app falla al arrancar
# con un error claro, en vez de fallar silenciosamente en el primer request.
openai.api.key=${OPENAI_API_KEY}
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.openai.com/v1}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}

# --- CORS: que origen del frontend puede llamar a esta API ---
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# --- Base de datos H2 en memoria (bonus de storage) ---
# "mem:cleardraft" = la base de datos vive solo en RAM mientras el proceso corre;
# se reinicia vacia cada vez que reinicias el backend. Suficiente para demostrar
# el concepto sin necesitar Postgres ni Docker.
spring.datasource.url=jdbc:h2:mem:cleardraft
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate crea/actualiza las tablas automaticamente a partir
# de las clases @Entity al arrancar. Comodo en desarrollo; en un proyecto real
# de produccion se reemplaza por migraciones versionadas (ej. Flyway).
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 para inspeccionar la base de datos en el navegador durante
# desarrollo: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:cleardraft)
spring.h2.console.enabled=true

# Evita que Hibernate mantenga la conexion a la base de datos abierta durante
# todo el ciclo de vida de la peticion HTTP (una practica recomendada; aqui no
# la necesitamos porque no hay carga perezosa de relaciones entre entidades).
spring.jpa.open-in-view=false
